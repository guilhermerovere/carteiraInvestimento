spring:
  application:
    name: carteira-investimento-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 4000
            readTimeout: 4000

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

application:
  cash-movements:
    snapshot-zone: ${CASH_MOVEMENTS_SNAPSHOT_ZONE:America/Sao_Paulo}
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration-hours: ${JWT_EXPIRATION_HOURS:24}
      issuer: ${JWT_ISSUER:carteira-investimento-backend}
      audience: ${JWT_AUDIENCE:carteira-investimento-api}
  bootstrap:
    admin:
      name: ${ADMIN_NAME}
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}
  market-quotes:
    brapi:
      url: ${BRAPI_URL:https://brapi.dev}
      credential: ${BRAPI_TOKEN:}
    alpha-vantage:
      url: ${ALPHAVANTAGE_URL:https://www.alphavantage.co}
      credential: ${ALPHAVANTAGE_API_KEY:}
    twelve-data:
      url: ${TWELVE_DATA_URL:https://api.twelvedata.com}
      credential: ${TWELVE_DATA_API_KEY:}
  broker-catalog:
    brasil-api-cnpj:
      url: ${BRASIL_API_CNPJ_URL:https://brasilapi.com.br}
    brasil-api-cvm:
      url: ${BRASIL_API_CVM_URL:https://brasilapi.com.br}
    via-cep:
      url: ${VIA_CEP_URL:https://viacep.com.br}
  logo-dev:
    url: ${LOGO_DEV_URL:https://api.logo.dev}
    secret-key: ${LOGO_DEV_SECRET_KEY:}

