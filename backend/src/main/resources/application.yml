spring:
  application:
    name: carteira-investimento-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration-hours: ${JWT_EXPIRATION_HOURS:24}
      issuer: ${JWT_ISSUER:carteira-investimento-backend}
      audience: ${JWT_AUDIENCE:carteira-investimento-api}
  bootstrap:
    admin:
      name: ${ADMIN_NAME}
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}

