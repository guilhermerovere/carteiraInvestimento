services:
  postgres-db:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      BACKEND_PORT: 8080
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      JWT_ISSUER: ${JWT_ISSUER:-carteira-investimento-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-carteira-investimento-api}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BRAPI_URL: ${BRAPI_URL:-https://brapi.dev}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      ALPHAVANTAGE_URL: ${ALPHAVANTAGE_URL:-https://www.alphavantage.co}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      TWELVE_DATA_URL: ${TWELVE_DATA_URL:-https://api.twelvedata.com}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      BRASIL_API_CNPJ_URL: ${BRASIL_API_CNPJ_URL:-https://brasilapi.com.br}
      BRASIL_API_CVM_URL: ${BRASIL_API_CVM_URL:-https://brasilapi.com.br}
      VIA_CEP_URL: ${VIA_CEP_URL:-https://viacep.com.br}
      LOGO_DEV_URL: ${LOGO_DEV_URL:-https://api.logo.dev}
      LOGO_DEV_SECRET_KEY: ${LOGO_DEV_SECRET_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8080}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_LOGO_DEV_PUBLISHABLE_KEY: ${NEXT_PUBLIC_LOGO_DEV_PUBLISHABLE_KEY:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:

